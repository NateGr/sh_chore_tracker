name: Validate repository
description: Shared scaffold and integration checks for CI and releases
inputs:
  require-integration:
    description: Fail if the integration is not ready
    default: "false"
outputs:
  integration-ready:
    description: Whether integration checks were enabled
    value: ${{ steps.readiness.outputs.integration-ready }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14.2"
        cache: pip
        cache-dependency-path: |
          requirements_test.txt
          requirements/latest/requirements.txt
    - name: Install test tools
      shell: bash
      run: python -m pip install -r requirements_test.txt
    - name: Check import readiness
      id: readiness
      shell: bash
      env:
        REQUIRE_INTEGRATION: ${{ inputs.require-integration }}
      run: |
        arguments=()
        if [[ "$REQUIRE_INTEGRATION" == "true" ]]; then
          arguments+=(--require-integration)
        fi
        python scripts/release.py check "${arguments[@]}"
    - name: Lint
      shell: bash
      run: python -m ruff check .
    - name: Check formatting
      shell: bash
      run: python -m ruff format --check --exclude '*.md' .
    - name: Type check integration
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: python -m mypy custom_components/sh_chore_tracker/ --ignore-missing-imports
    - name: Verify minimum Home Assistant baseline
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: python scripts/check_ha_compatibility.py minimum
    - name: Test minimum Home Assistant
      shell: bash
      env:
        INTEGRATION_READY: ${{ steps.readiness.outputs.integration-ready }}
      run: |
        arguments=(--cov=scripts --cov-report=term-missing "--cov-report=xml:${RUNNER_TEMP}/coverage-minimum.xml")
        if [[ "$INTEGRATION_READY" == "true" ]]; then
          arguments+=(--cov=custom_components/sh_chore_tracker)
        fi
        python -m pytest tests/ "${arguments[@]}"
    - name: Enforce minimum integration coverage
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: python -m coverage report --include='*/custom_components/sh_chore_tracker/*' --fail-under=80
    - name: Install latest fixture environment
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/ha-latest"
        "$RUNNER_TEMP/ha-latest/bin/python" -m pip install -r requirements/latest/requirements.txt
    - name: Verify latest fixture baseline
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" scripts/check_ha_compatibility.py latest'
    - name: Test latest fixture Home Assistant
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" -m pytest tests/ --cov=scripts --cov=custom_components/sh_chore_tracker --cov-report=term-missing --cov-report="xml:${RUNNER_TEMP}/coverage-latest.xml"'
    - name: Enforce latest integration coverage
      if: steps.readiness.outputs.integration-ready == 'true'
      shell: bash
      run: '"$RUNNER_TEMP/ha-latest/bin/python" -m coverage report --include="*/custom_components/sh_chore_tracker/*" --fail-under=80'
    - name: Validate Home Assistant metadata
      if: steps.readiness.outputs.integration-ready == 'true'
      uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
    - name: Validate public HACS repository
      if: steps.readiness.outputs.integration-ready == 'true' && !github.event.repository.private
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration
        repository: ${{ github.repository }}
        comment: "false"
    - name: Report validation scope
      shell: bash
      env:
        INTEGRATION_READY: ${{ steps.readiness.outputs.integration-ready }}
        PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
      run: |
        if [[ "$INTEGRATION_READY" != "true" ]]; then
          echo "Scaffold checks only. Integration validation and releases are blocked until import." >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$PRIVATE_REPOSITORY" == "true" ]]; then
          echo "Integration checks passed. Public HACS validation is still required after publication." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Scaffold, integration, hassfest, and public HACS checks passed." >> "$GITHUB_STEP_SUMMARY"
        fi