name: Validate repository
description: Shared scaffold and integration checks for CI and releases
inputs:
  require-integration:
    description: Fail if the integration is not ready
    default: "false"
outputs:
  integration-ready:
    description: Whether integration checks were enabled
    value: ${{ steps.readiness.outputs.integration-ready }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements_test.txt
    - name: Install test tools
      shell: bash
      run: python -m pip install -r requirements_test.txt
    - name: Check import readiness
      id: readiness
      shell: bash
      env:
        REQUIRE_INTEGRATION: ${{ inputs.require-integration }}
      run: |
        arguments=()
        if [[ "$REQUIRE_INTEGRATION" == "true" ]]; then
          arguments+=(--require-integration)
        fi
        python scripts/release.py check "${arguments[@]}"
    - name: Lint
      shell: bash
      run: python -m ruff check .
    - name: Check formatting
      shell: bash
      run: python -m ruff format --check .
    - name: Test
      shell: bash
      env:
        INTEGRATION_READY: ${{ steps.readiness.outputs.integration-ready }}
      run: |
        arguments=(--cov=scripts --cov-report=term-missing --cov-report=xml)
        if [[ "$INTEGRATION_READY" == "true" ]]; then
          arguments+=(--cov=custom_components/chore_tracker)
        fi
        python -m pytest tests/ "${arguments[@]}"
    - name: Validate Home Assistant metadata
      if: steps.readiness.outputs.integration-ready == 'true'
      uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master
    - name: Validate public HACS repository
      if: steps.readiness.outputs.integration-ready == 'true' && !github.event.repository.private
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration
        repository: ${{ github.repository }}
        comment: "false"
    - name: Report validation scope
      shell: bash
      env:
        INTEGRATION_READY: ${{ steps.readiness.outputs.integration-ready }}
        PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
      run: |
        if [[ "$INTEGRATION_READY" != "true" ]]; then
          echo "Scaffold checks only. Integration validation and releases are blocked until import." >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$PRIVATE_REPOSITORY" == "true" ]]; then
          echo "Integration checks passed. Public HACS validation is still required after publication." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Scaffold, integration, hassfest, and public HACS checks passed." >> "$GITHUB_STEP_SUMMARY"
        fi