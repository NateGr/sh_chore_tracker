name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this help you accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Include alternatives you have considered.
    validations:
      required: true